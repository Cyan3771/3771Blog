<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的个人名片</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
      }
      .main {
        background-color: #eff;

        min-height: 100vh;

        padding: 30px;

        text-align: center;
      }
      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 10px;

        margin-bottom: 30px;

        box-shadow: 5px 5px 12px rgba(0, 51, 51, 0.1);
      }
      .content {
        background-color: #fff;

        border-radius: 10px;
        height: 100%;

        padding: 30px;

        box-shadow: 5px 5px 12px rgba(0, 51, 51, 0.1);
      }
      .contact {
        text-align: left;
      }

      a:link {
        color: hsl(180, 70%, 50%);
        text-decoration: none;
      }

      a:visited {
        color: hsl(200, 70%, 50%);
      }

      a:hover {
        color: hsl(180, 90%, 50%);
        text-decoration: underline;
      }

      a:active {
        color: hsl(180, 70%, 40%);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <img src="/icon.png" alt="avatar" class="avatar" />

      <div class="content">
        <h1>Cyan3771</h1>

        <ul class="contact">
          <li>邮箱: yangjiahao36@outlook.com</li>
          <li>电话: 114514</li>
        </ul>

        <p>
          Go to
          <a href="https://im3771.click/" target="_blank"

</html>
